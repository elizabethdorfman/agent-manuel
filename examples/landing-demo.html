<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Penny Jar sign up</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 -apple-system,system-ui,sans-serif;color:#2b1630;background:#fbf7fa}
header{background:#401934;color:#fff;font-weight:800;font-size:20px;padding:14px 24px}
main{padding:22px 24px 120px}
h1{font-size:28px;line-height:1.15;margin:0 0 8px}
.lede{margin:0 0 18px;color:#5a4660}
label{display:block;font-weight:600;font-size:14px;margin:0 0 4px}
input{display:block;width:100%;height:46px;font:16px system-ui;padding:0 12px;border:1px solid #c9b8c4;border-radius:10px;background:#fff;margin:0 0 14px}
/* ALIGNMENT bug: a stray margin pushes the email field 6px left of the column */
#email{margin-left:-6px;width:calc(100% + 6px)}
.row{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:15px}
/* READABILITY bug: the label is clipped with an ellipsis */
#remember-label{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
.btn{display:block;width:100%;height:50px;border:0;border-radius:25px;font:600 16px system-ui;margin:0 0 12px}
#create{background:#401934;color:#fff}
/* HIERARCHY bug: a second filled button competes with the main action */
#apple{background:#401934;color:#fff}
/* READABILITY bug: faint grey fine print on white */
#terms{font-size:13px;color:#c4c4c4;margin:6px 0 0}
#forgot{display:inline-block;margin-top:150px;color:#401934;font-weight:600}
/* READABILITY bug: a fixed cookie banner sits on top of the "Forgot password?" link */
#cookies{position:fixed;left:12px;right:12px;bottom:12px;background:#fff;border:1px solid #e5dbe2;border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.12);font-size:14px}
#cookies button{margin-top:8px;height:38px;padding:0 16px;border-radius:19px;border:1px solid #c9b8c4;background:#fff;font:600 14px system-ui}
</style></head><body>
<header>Penny Jar</header>
<main>
 <h1 id="headline">Start saving without the guilt.</h1>
 <p class="lede" id="lede">Make a free account to track small treats.</p>
 <label for="email" id="email-label">Email</label>
 <input id="email" type="email" placeholder="you@example.com">
 <label for="password" id="password-label">Password</label>
 <input id="password" type="password" placeholder="At least 12 characters">
 <div class="row"><input type="checkbox" id="remember" style="width:20px;height:20px;margin:0"><span id="remember-label">Keep me signed in on this device</span></div>
 <button class="btn" id="create">Create account</button>
 <button class="btn" id="apple">Continue with Apple</button>
 <p id="terms">By creating an account you agree to our Terms and Privacy Policy.</p>
 <a href="#" id="forgot">Forgot password?</a>
</main>
<div id="cookies">We use cookies to understand how Penny Jar is used.<br><button>Accept</button> <button>Decline</button></div>
</body></html>
