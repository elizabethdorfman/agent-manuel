<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Review · Penny Jar</title></head>
<body data-page="review">
<header class="topbar"><svg class="jar" viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="3" width="14" height="4" rx="1.5" fill="#C9772E"/><path d="M8 9h16a2 2 0 0 1 2 2v15a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V11a2 2 0 0 1 2-2z" fill="#EAF5F2" stroke="#0E5A52" stroke-width="2"/><circle cx="16" cy="20" r="4" fill="#C9772E"/></svg><a class="brand" id="brand-name" href="index.html">Penny Jar</a></header>
<main class="screen">
  <h1 id="review-title">Does this look right?</h1>
  <p class="banner" id="review-banner"></p>
  <h2 id="review-heading">Your amounts</h2>
  <ul class="amounts" id="review-list"></ul>
  <p id="review-empty" hidden>No amounts left. Go back to add some.</p>
  <h3 id="review-total-title">Today's total</h3>
  <p class="total-figure" id="review-total"></p>
  <button class="btn btn-primary" id="looks-right" type="button">Looks right</button>
  <button class="btn btn-danger" id="delete-data" type="button">Delete my data</button>
</main>
<dialog id="edit-dialog" aria-labelledby="edit-title">
  <div class="dialog-head">
    <h2 id="edit-title">Edit amount</h2>
    <button type="button" id="edit-close" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <form id="edit-form" method="dialog">
    <label for="edit-amount">Amount</label>
    <input type="number" id="edit-amount" autofocus step="0.01" min="0" inputmode="decimal">
    <label for="edit-label">What was it?</label>
    <input type="text" id="edit-label">
    <button class="btn btn-primary" id="edit-save" type="submit">Save</button>
  </form>
</dialog>
<script src="app.js"></script>
</body></html>
