<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Log in · Penny Jar</title></head>
<body data-page="login">
<header class="topbar"><svg class="jar" viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="3" width="14" height="4" rx="1.5" fill="#C9772E"/><path d="M8 9h16a2 2 0 0 1 2 2v15a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V11a2 2 0 0 1 2-2z" fill="#EAF5F2" stroke="#0E5A52" stroke-width="2"/><circle cx="16" cy="20" r="4" fill="#C9772E"/></svg><a class="brand" id="brand-name" href="index.html">Penny Jar</a></header>
<main class="screen">
  <h1 id="login-title">Welcome back</h1>
  <p class="lede">Log in to see past entries.</p>
  <form id="login-form" novalidate>
    <label for="login-email">Email</label>
    <input type="email" id="login-email" autocomplete="email" placeholder="you@example.com">
    <label for="login-password">Password</label>
    <input type="password" id="login-password" autocomplete="current-password">
    <p class="error" id="login-error" role="alert" hidden>Logging in is turned off in this demo.</p>
    <button class="btn btn-primary" id="login-submit" type="submit">Log in</button>
  </form>
  <a class="btn btn-ghost" id="login-back" href="index.html">Back to start</a>
</main>
<script src="app.js"></script>
</body></html>
