<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Saved · Penny Jar</title></head>
<body data-page="done">

    <div class="receipt-row"><span>Spent</span><strong id="receipt-spent"></strong></div>
    <div class="receipt-row"><span>Amounts</span><strong id="receipt-count"></strong></div>

<script src="app.js"></script>
