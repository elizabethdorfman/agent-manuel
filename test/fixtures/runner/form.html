<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact</title>
<style>body{font:16px system-ui;margin:24px}label,input,textarea,button{display:block;margin:6px 0}section{margin:24px 0}</style></head>
<body><main><h1>Contact</h1>
<section><h2>Write to us</h2>
<form action="/thanks.html" method="get"><label>Your name <input name="name" required></label>
<label>Email <input type="email" name="email" required></label>
<label>Message <textarea name="message" maxlength="200" required></textarea></label>
<button>Send message</button></form></section>
<section><h2>Create account</h2>
<form action="/signup" method="post"><label>Email <input type="email" name="signup-email"></label><button>Continue</button></form></section>
<a href="/">Home</a></main></body></html>
